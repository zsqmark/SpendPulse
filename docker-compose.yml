# SpendPulse backend stack (target: Amazon Lightsail VPS).
# IMPORTANT: create .env.local in this directory first — it holds secrets and is git-ignored,
# so it is NOT shipped in the image or the repo. Copy it from your local project.
#
# Only Caddy is exposed to the internet (80/443). The app publishes nothing publicly; it is
# reachable on 127.0.0.1 for local checks, and internally as spendpulse:3000 for Caddy.
#
# The named volume keeps the file-backed DB alive across restarts and rebuilds:
#   data/database.json  +  data/documents  (uploaded invoice page images)
services:
  spendpulse:
    build: .
    image: spendpulse:latest
    container_name: spendpulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # host-only; internet traffic must come in via Caddy
    env_file:
      - .env.local              # secrets: DEEPSEEK_API_KEY etc.
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - spendpulse_data:/app/data   # PERSISTENT invoices + documents

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"     # required for the HTTP-01 challenge / redirect
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certificates (must persist)
      - caddy_config:/config
    depends_on:
      - spendpulse

volumes:
  spendpulse_data:
  caddy_data:
  caddy_config:
